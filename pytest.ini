[pytest]
# Configuración de pytest para el proyecto

# Directorio donde buscar tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto al ejecutar pytest
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --tb=short
    # Coverage options
    --cov=modules
    --cov=utils
    --cov=main
    --cov=config
    # Coverage report options
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Warnings
    --strict-markers
    -W ignore::DeprecationWarning
    # Parallel execution (uncomment if pytest-xdist is installed)
    # -n auto

# Markers personalizados
markers =
    unit: Unit tests (deselect with '-m "not unit"')
    integration: Integration tests (deselect with '-m "not integration"')
    slow: Slow tests (deselect with '-m "not slow"')
    api: API endpoint tests
    parsers: Parser tests
    cache: Cache tests
    backup: Backup tests
    partitions: Partition tests

# Mínimo porcentaje de coverage requerido
# (descomenta para fallar si no se alcanza)
# --cov-fail-under=80

# Timeout por defecto para tests (en segundos)
timeout = 300

# Directorio para reports de coverage HTML
[coverage:html]
directory = htmlcov

[coverage:run]
# Archivos a omitir en coverage
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    debug.py

# Branch coverage
branch = True

[coverage:report]
# Precisión de porcentajes
precision = 2

# Omitir líneas con estos patrones
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
