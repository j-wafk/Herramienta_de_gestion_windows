name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Pytest + Coverage
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci_secret_key_for_testing_only
      ADMIN_PASSWORD: Admin12345678!
      FIELD_ENCRYPTION_KEY: ci_field_encryption_key_32bytes!!
      DATABASE_URL: sqlite:///ci_test.db

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar tests con cobertura
        run: |
          pytest \
            --cov=modules \
            --cov=utils \
            --cov=main \
            --cov=config \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -v

      - name: Subir reporte de cobertura a Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Flake8 Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar flake8
        run: pip install flake8==7.0.0

      - name: Ejecutar flake8
        run: |
          flake8 modules/ utils/ main.py config.py \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=__pycache__,.venv,migrations
