<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Notificación{% endblock %}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f2328;">
  <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;margin:0 auto;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e5e7eb">
    <tr>
      <td style="background:#005FD2;padding:18px 24px;color:#fff;font-size:18px;font-weight:600">
        {% block header %}Control Remoto para Windows{% endblock %}
      </td>
    </tr>
    <tr>
      <td style="padding:24px;line-height:1.5;font-size:14px;color:#1f2328">
        {% block content %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td style="padding:14px 24px;background:#fafbfc;border-top:1px solid #eef0f3;font-size:12px;color:#6b7280">
        {% block footer %}
          Este es un mensaje automático de la herramienta de gestión.
          No respondas a este correo.
        {% endblock %}
      </td>
    </tr>
  </table>
</body>
</html>
