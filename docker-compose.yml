services:

  # ── nginx — Proxy inverso TLS (HTTPS) ───────────────────────────────────────
  # El certificado autofirmado se genera dentro de la imagen al construirla
  # (ver nginx/Dockerfile), así que no hace falta proveer nada en el host.
  # Para usar un certificado propio (p. ej. Let's Encrypt en producción), crea
  # un docker-compose.override.yml que monte tus archivos en
  # /etc/nginx/certs/server.crt y /etc/nginx/certs/server.key.
  nginx:
    build: ./nginx
    ports:
      - "80:80"     # redirige a HTTPS
      - "443:443"   # HTTPS terminado aquí
    depends_on:
      flask:
        condition: service_healthy   # esperar a que Flask responda /health
    restart: unless-stopped

  # ── Flask — App Python (solo red interna, sin puerto expuesto) ───────────────
  flask:
    build: .
    expose:
      - "5000"          # visible sólo para nginx en la red Docker interna
    env_file:
      - .env
    environment:
      # Variables no secretas — los secretos vienen del .env
      # FIELD_ENCRYPTION_KEY debe definirse en .env (cifra email, nombres y
      # cuerpos de correo almacenados en la BD).
      # Genera una con: python -c "import secrets; print(secrets.token_hex(32))"
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=require
      - POWERSHELL_SERVER=host.docker.internal
      - POWERSHELL_PORT=12345
      - FLASK_DEBUG=False
      - FLASK_ENV=production
      - METRICS_RETENTION_DAYS=30
      - CORS_ALLOWED_ORIGINS=https://localhost
      # SMTP — la configuración viene del .env (MAIL_ENABLED, SMTP_*, MAIL_FROM*).
      # Si no defines MAIL_ENABLED en .env, el envío queda desactivado.
      # Ejemplo MailHog (dev): SMTP_HOST=mailhog SMTP_PORT=1025
      # Ejemplo Gmail (prod): SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USE_TLS=true
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistir audit.log + app.log fuera del contenedor para que sobrevivan
      # a docker compose down/up. Los logs quedan en ./logs del host y se pueden
      # inspeccionar directamente.
      - ./logs:/app/logs
      # Frontend en bind-mount: cambios en JS/HTML/CSS aplican sin rebuild.
      - ./static:/app/static
      - ./templates:/app/templates
    healthcheck:
      # Usamos http.client en vez de urllib para NO seguir redirects.
      # Why: Talisman en FLASK_ENV=production fuerza HTTP→HTTPS, así que
      # GET http://localhost:5000/health devuelve 302; urllib lo seguiría
      # a HTTPS y fallaría (Flask solo escucha HTTP en :5000).
      # Aceptamos cualquier status < 500: si Flask responde, está vivo.
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('localhost',5000,timeout=2); c.request('GET','/health'); sys.exit(0 if c.getresponse().status<500 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s   # margen para crear tablas y arrancar workers
    restart: unless-stopped

  # ── MailHog — SMTP catch-all para desarrollo ────────────────────────────────
  # SMTP en :1025 (red interna)  |  UI web en http://localhost:18025
  # Puerto alto para evitar los rangos reservados por Hyper-V/WSL2 en Windows
  # (típicamente alguna ventana entre 8000-49000). En producción: desactiva
  # este servicio y usa un SMTP real (Gmail, Outlook, AWS SES, etc.).
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "18025:8025"   # host 18025 → container 8025 (UI web)
    expose:
      - "1025"         # SMTP solo accesible desde la red docker interna
    restart: unless-stopped

  # ── PostgreSQL — Base de datos con SSL ──────────────────────────────────────
  postgres:
    build: ./postgres
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"          # visible sólo internamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
